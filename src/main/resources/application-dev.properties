# ── Development profile ──────────────────────────────────────────────────────────────────────
# File-based H2: exchange rate history survives application restarts, enabling the
# incremental loader to skip data that has already been downloaded.
#
# Activate: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#           (or set SPRING_PROFILES_ACTIVE=dev in your IDE run configuration)

spring.datasource.url=jdbc:h2:file:./data/exchangerates;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" creates missing tables/columns but never drops existing data.
spring.jpa.hibernate.ddl-auto=update
