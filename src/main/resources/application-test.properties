# ── Test profile ─────────────────────────────────────────────────────────────────────────────
# In-memory H2: fast, fully isolated, and leaves no files on disk.
# The schema is created fresh at context startup and dropped on shutdown,
# so every @SpringBootTest run starts from a clean state.
#
# Activate: @ActiveProfiles("test") on @SpringBootTest classes

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "create-drop" guarantees a clean schema for every test run.
spring.jpa.hibernate.ddl-auto=create-drop
