bundesbank.api.base-url=https://api.statistiken.bundesbank.de/rest
bundesbank.api.connect-timeout-ms=20000
# Full history ZIP can be several MB — allow enough time for the download
bundesbank.api.read-timeout-ms=120000

# Dates in API responses as "2024-01-02", not [2024,1,2]
spring.jackson.serialization.write-dates-as-timestamps=false

# Earliest date to fetch when the database is empty
loader.history.start-date=1999-01-01

# Rows sent per JDBC round-trip during bulk insert.
# 1000 rows/batch keeps round-trips ~180 for a full history load of ~180K records.
loader.jdbc.batch-size=1000

# Raise the ceiling so clients can request larger pages if needed.
# Spring's default cap is 2000; set higher to accommodate bulk exports.
spring.data.web.pageable.max-page-size=10000

# Activate a profile explicitly:
#   Dev:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   Test: @ActiveProfiles("test") on @SpringBootTest classes, or mvn test -Dspring.profiles.active=test
spring.profiles.default=dev
