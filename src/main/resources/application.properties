bundesbank.api.base-url=https://api.statistiken.bundesbank.de/rest
bundesbank.api.connect-timeout-ms=20000
# Full history ZIP can be several MB — allow enough time for the download
bundesbank.api.read-timeout-ms=120000

# H2 file-based DB so exchange rate history survives restarts
spring.datasource.url=jdbc:h2:file:./data/exchangerates;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Dates in API responses as "2024-01-02", not [2024,1,2]
spring.jackson.serialization.write-dates-as-timestamps=false

# Earliest date to fetch when the database is empty
loader.history.start-date=1999-01-01
